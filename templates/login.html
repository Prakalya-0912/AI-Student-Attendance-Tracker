<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Login - AI Student Attendance Tracker
  </title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  >

</head>


<body class="auth-body">


<div class="auth-page-container">

  <div class="auth-card">


    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <div class="auth-header">

      <div
        class="sidebar-logo-icon"
        style="
          margin:0 auto 12px;
          width:48px;
          height:48px;
          font-size:26px;
        "
      >
        🎓
      </div>

      <h2>
        Faculty & Staff Login
      </h2>

      <p>
        AI Student Attendance Tracker & Analytics Portal
      </p>

    </div>


    <!-- ============================= -->
    <!-- DEMO CREDENTIALS -->
    <!-- ============================= -->

    <div class="demo-credentials-box">

      <div
        style="
          font-size:11.5px;
          font-weight:700;
          text-transform:uppercase;
          color:#1E40AF;
          margin-bottom:4px;
        "
      >

        ⚡ Instant Academic Demo Credentials:

      </div>


      <div
        style="
          font-size:12.5px;
          color:#1E3A8A;
          margin-bottom:8px;
        "
      >

        Username:
        <strong>admin</strong>

        &nbsp;|&nbsp;

        Password:
        <strong>admin123</strong>

      </div>


      <button
        type="button"
        id="fillDemoCredsBtn"
        class="btn btn-secondary btn-sm"
        style="
          font-size:11.5px;
          padding:4px 10px;
          border-color:#93C5FD;
          color:#1D4ED8;
        "
      >

        ⚡ Click to Auto-Fill Demo Account

      </button>

    </div>


    <!-- ============================= -->
    <!-- LOGIN FORM -->
    <!-- ============================= -->

    <form id="loginForm">


      <!-- USERNAME -->
      <div class="form-group">

        <label
          for="loginIdentifier"
          class="form-label"
        >
          Username or College Email *
        </label>


        <input
          type="text"
          id="loginIdentifier"
          class="form-control"
          placeholder="e.g. admin or faculty@college.edu"
          required
          autofocus
        >

      </div>


      <!-- PASSWORD -->
      <div class="form-group">

        <div
          style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:6px;
          "
        >

          <label
            for="loginPassword"
            class="form-label"
            style="margin-bottom:0;"
          >
            Password *
          </label>

        </div>


        <input
          type="password"
          id="loginPassword"
          class="form-control"
          placeholder="••••••••"
          required
        >

      </div>


      <!-- LOGIN BUTTON -->
      <button
        type="submit"
        id="loginSubmitBtn"
        class="btn btn-primary btn-block"
        style="
          padding:12px;
          font-size:14.5px;
          margin-top:16px;
        "
      >

        🔐 Log In to Attendance Dashboard

      </button>


    </form>


    <!-- ============================= -->
    <!-- REGISTER LINK -->
    <!-- ============================= -->

    <div class="auth-footer">

      Don't have an account yet?

      <a
        href="/register"
        style="font-weight:700;"
      >
        Register Here →
      </a>

    </div>


  </div>

</div>



<!-- ================================================= -->
<!-- LOGIN JAVASCRIPT -->
<!-- ================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    /* ==========================================
       GET ELEMENTS
       ========================================== */

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginSubmitBtn");

    const usernameInput =
        document.getElementById("loginIdentifier");

    const passwordInput =
        document.getElementById("loginPassword");

    const demoButton =
        document.getElementById("fillDemoCredsBtn");


    /* ==========================================
       AUTO-FILL DEMO ACCOUNT
       ========================================== */

    demoButton.addEventListener("click", function () {

        usernameInput.value = "admin";

        passwordInput.value = "admin123";

        usernameInput.focus();

    });


    /* ==========================================
       LOGIN FORM SUBMISSION
       ========================================== */

    loginForm.addEventListener("submit", async function (event) {

        event.preventDefault();


        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        /* ======================================
           BASIC VALIDATION
           ====================================== */

        if (!username) {

            alert(
                "Please enter your username or college email."
            );

            return;

        }


        if (!password) {

            alert(
                "Please enter your password."
            );

            return;

        }


        /* ======================================
           DISABLE BUTTON
           ====================================== */

        loginButton.disabled = true;

        loginButton.innerText =
            "Logging In...";


        try {


            /* ==================================
               SEND LOGIN REQUEST
               ================================== */

            const response = await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },

                    credentials: "same-origin",

                    body: JSON.stringify({

                        username: username,

                        password: password

                    })

                }
            );


            /* ==================================
               IMPORTANT:
               READ RESPONSE AS TEXT FIRST
               ================================== */

            const responseText =
                await response.text();


            console.log(
                "Login server response:",
                responseText
            );


            /* ==================================
               CONVERT TEXT TO JSON
               ================================== */

            let result;


            try {

                result =
                    JSON.parse(responseText);

            }

            catch (jsonError) {

                console.error(
                    "Server returned non-JSON response:",
                    responseText
                );


                throw new Error(
                    "Server returned an unexpected response. " +
                    "Please check the Render deployment."
                );

            }


            /* ==================================
               SUCCESS
               ================================== */

            if (
                response.ok &&
                result.success
            ) {

                alert(
                    "Login successful! 🎉\n\n" +
                    "Welcome to the Attendance Dashboard."
                );


                /*
                 * Flask protects the dashboard with
                 * login_required.
                 *
                 * After successful login,
                 * go to the home page.
                 */

                window.location.href = "/";

                return;

            }


            /* ==================================
               LOGIN FAILED
               ================================== */

            alert(
                result.error ||
                result.message ||
                "Invalid username or password."
            );


        }

        catch (error) {


            /* ==================================
               NETWORK / SERVER ERROR
               ================================== */

            console.error(
                "Login Error:",
                error
            );


            alert(
                "Login failed.\n\n" +
                error.message
            );

        }


        finally {


            /* ==================================
               RESTORE BUTTON
               ================================== */

            loginButton.disabled = false;

            loginButton.innerText =
                "🔐 Log In to Attendance Dashboard";

        }

    });

});

</script>


</body>
</html>
