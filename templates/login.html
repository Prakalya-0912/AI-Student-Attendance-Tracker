<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AI Student Attendance Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">

<div class="auth-page-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="sidebar-logo-icon" style="margin: 0 auto 12px; width: 48px; height: 48px; font-size: 26px;">🎓</div>
      <h2>Faculty & Staff Login</h2>
      <p>AI Student Attendance Tracker & Analytics Portal</p>
    </div>

    <!-- Quick Demo Credentials Box -->
    <div class="demo-credentials-box">
      <div style="font-size: 11.5px; font-weight: 700; text-transform: uppercase; color: #1E40AF; margin-bottom: 4px;">
        ⚡ Instant Academic Demo Credentials:
      </div>
      <div style="font-size: 12.5px; color: #1E3A8A; margin-bottom: 8px;">
        Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>admin123</strong>
      </div>
      <button type="button" id="fillDemoCredsBtn" class="btn btn-secondary btn-sm" style="font-size: 11.5px; padding: 4px 10px; border-color: #93C5FD; color: #1D4ED8;">
        ⚡ Click to Auto-Fill Demo Account
      </button>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
      <div class="form-group">
        <label for="loginIdentifier" class="form-label">Username or College Email *</label>
        <input type="text" id="loginIdentifier" class="form-control" placeholder="e.g. admin or faculty@college.edu" required autofocus>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label for="loginPassword" class="form-label" style="margin-bottom: 0;">Password *</label>
        </div>
        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block" style="padding: 12px; font-size: 14.5px; margin-top: 16px;">
        🔐 Log In to Attendance Dashboard
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account yet? <a href="/register" style="font-weight: 700;">Register Here →</a>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initLoginPage();
  });
</script>
</body>
</html>
